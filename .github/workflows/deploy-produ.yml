name: Backend · produ

on:
  push:
    branches: [produ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend-produ
  cancel-in-progress: false

jobs:
  backend:
    if: github.repository == 'donmatthiuz/G-T-NOVU-Prototipo' && github.ref == 'refs/heads/produ'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: adfasdfasfd-1899a
      GCP_REGION: us-central1
      GCP_SERVICE: novu-api
      GCP_ENV_FILE: infra/google-cloud/env.production.yaml
      # El servicio ya es público. CI conserva su IAM y sólo publica revisiones.
      GCP_MANAGE_PUBLIC_ACCESS: "false"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Obtener el código del push
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"

      - name: Instalar el backend y sus herramientas de prueba
        run: python -m pip install './backend[test]'

      - name: Probar el backend
        working-directory: backend
        run: python -m pytest

      - name: Autenticar con Google Cloud mediante OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/248394644314/locations/global/workloadIdentityPools/novu-github/providers/produ
          service_account: novu-github-deploy@adfasdfasfd-1899a.iam.gserviceaccount.com

      - name: Preparar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Publicar FastAPI y comprobar su salud
        run: bash infra/google-cloud/deploy.sh
