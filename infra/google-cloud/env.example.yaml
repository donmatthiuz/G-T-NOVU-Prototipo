# Copiá a env.local.yaml y reemplazá el bucket y los dominios.
# Sólo configuración pública. MONGODB_URI y API_GPT vienen de Secret Manager.
ENVIRONMENT: "production"
MONGODB_DATABASE: "novu"
API_PREFIX: "/v1"
CORS_ORIGINS: "https://novu-prototipo-gt.netlify.app"
KYC_GCS_BUCKET: "REEMPLAZAR_BUCKET_PRIVADO"
SEED_DEMO_DATA: "false"
OPENAI_MODEL: "gpt-5-mini"
OPENAI_MAX_OUTPUT_TOKENS: "1600"
