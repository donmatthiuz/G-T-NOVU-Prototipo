[project]
name = "novu-backend"
version = "0.1.0"
description = "API de NOVU para autenticación, dashboard y copiloto financiero"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23.1,<26",
  "email-validator>=2.2,<3",
  "fastapi>=0.116,<1",
  "openai>=1.99,<3",
  "pydantic-settings>=2.10,<3",
  "pymongo>=4.13,<5",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

