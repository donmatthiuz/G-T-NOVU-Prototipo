services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    environment:
      # MongoDB's bundled TCMalloc is incompatible with the newer kernel rseq
      # behavior. Restore glibc-managed rseq on Linux kernels >= 6.19.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        mongosh --host mongo:27017 --quiet --eval
        'try { rs.status() } catch (error) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'
    restart: "no"

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/novu?replicaSet=rs0&directConnection=true
      MONGODB_DATABASE: novu
      CORS_ORIGINS: http://localhost:3000
      KYC_STORAGE_PATH: /data/kyc
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    volumes:
      - kyc_data:/data/kyc
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo_data:
  kyc_data:
